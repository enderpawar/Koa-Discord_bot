[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
addopts = "-q --tb=short --strict-markers"
markers = [
    "live: tests requiring live network or Discord (skipped by default)",
    "slow: long-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:audioop_lts.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
