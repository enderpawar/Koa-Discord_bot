<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>코아 관리자</title>
<style nonce="{{NONCE}}">
:root{
  --bg:#eef1f8; --bg-accent:#dfe5f7;
  --panel:#fff; --line:#dbe1ec; --line-strong:#c3ccdd;
  --text:#14161c; --muted:#5f6b81;
  --brand:#5865f2; --brand-ink:#3d47c4; --brand-soft:#eef0ff;
  --danger:#b42318; --danger-soft:#fff1f0; --danger-line:#f3b7b2;
  --shadow:0 24px 60px -28px rgba(24,32,64,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1017; --bg-accent:#141a27;
    --panel:#161b26; --line:#252d3d; --line-strong:#333d52;
    --text:#e9edf5; --muted:#94a1b8;
    --brand:#7b86ff; --brand-ink:#aeb5ff; --brand-soft:#1c2138;
    --danger:#ff8a80; --danger-soft:#2a1614; --danger-line:#5b2b26;
    --shadow:0 24px 60px -28px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%, var(--bg-accent), var(--bg)) fixed;
  color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo",Inter,system-ui,"Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.5;
}
main{
  width:100%; max-width:400px; background:var(--panel);
  border:1px solid var(--line); border-radius:18px; padding:36px 32px 32px;
  box-shadow:var(--shadow);
}
.mark{
  width:52px; height:52px; display:grid; place-items:center; margin-bottom:20px;
  border:3px solid var(--text); border-radius:14px;
  box-shadow:4px 4px 0 var(--brand);
  font-family:Bahnschrift,"Arial Narrow",sans-serif; font-weight:900; font-size:24px;
}
h1{font-size:21px; margin:0 0 6px; letter-spacing:-.01em}
.sub{margin:0 0 26px; color:var(--muted); font-size:13.5px}
label{display:block; font-size:12px; font-weight:800; color:var(--muted); margin-bottom:8px; letter-spacing:.02em}
input{
  width:100%; height:46px; padding:0 13px; font-size:15px;
  color:var(--text); background:var(--bg); border:1px solid var(--line-strong);
  border-radius:10px; transition:border-color .15s, box-shadow .15s;
}
input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent)}
button{
  width:100%; height:46px; margin-top:18px; border:0; border-radius:10px;
  background:var(--brand); color:#fff; font-size:15px; font-weight:800; cursor:pointer;
  transition:filter .15s;
}
button:hover{filter:brightness(1.08)}
button:active{filter:brightness(.94)}
.error{
  margin:0 0 18px; padding:11px 13px; border-radius:10px; font-size:13.5px; font-weight:700;
  background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger-line);
}
.foot code{font-size:12px}
.foot{margin:22px 0 0; font-size:12px; color:var(--muted); text-align:center; line-height:1.6}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">K</div>
  <h1>코아 관리자</h1>
  <p class="sub">서버 로그인 키를 입력하세요. 코아를 초대할 때 서버 소유자에게 DM으로 보낸 키입니다.</p>
  <!--ERROR-->
  <form method="post" action="/login">
    <label for="token">로그인 키</label>
    <input id="token" name="token" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">로그인</button>
  </form>
  <p class="foot">키를 잃어버렸다면 서버에서 <code>/관리자 키재발급</code> 을 실행하세요.<br>5회 연속 실패 시 15분간 차단됩니다.</p>
</main>
</body>
</html>
