<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>코아 관리자</title>
<style nonce="{{NONCE}}">
:root{
  --bg:#eef1f8; --bg-accent:#dfe5f7;
  --panel:#fff; --line:#dbe1ec; --line-strong:#c3ccdd;
  --text:#14161c; --muted:#5f6b81;
  --brand:#5865f2; --brand-ink:#3d47c4; --brand-soft:#eef0ff;
  --danger:#b42318; --danger-soft:#fff1f0; --danger-line:#f3b7b2; --ok:#137a4b;
  --shadow:0 24px 60px -28px rgba(24,32,64,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1017; --bg-accent:#141a27;
    --panel:#161b26; --line:#252d3d; --line-strong:#333d52;
    --text:#e9edf5; --muted:#94a1b8;
    --brand:#7b86ff; --brand-ink:#aeb5ff; --brand-soft:#1c2138;
    --danger:#ff8a80; --danger-soft:#2a1614; --danger-line:#5b2b26; --ok:#65d6a2;
    --shadow:0 24px 60px -28px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%, var(--bg-accent), var(--bg)) fixed;
  color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo",Inter,system-ui,"Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.5;
}
main{
  width:100%; max-width:400px; background:var(--panel);
  border:1px solid var(--line); border-radius:18px; padding:36px 32px 32px;
  box-shadow:var(--shadow);
}
.mark{
  width:52px; height:52px; display:grid; place-items:center; margin-bottom:20px;
  border:3px solid var(--text); border-radius:14px;
  box-shadow:4px 4px 0 var(--brand);
  font-family:Bahnschrift,"Arial Narrow",sans-serif; font-weight:900; font-size:24px;
}
h1{font-size:21px; margin:0 0 6px; letter-spacing:-.01em}
.sub{margin:0 0 24px; color:var(--muted); font-size:13.5px}
.status{
  margin:0; padding:13px 14px; border:1px solid var(--line); border-radius:10px;
  color:var(--muted); background:var(--bg); font-size:13.5px; font-weight:700;
}
.status.ok{color:var(--ok); border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.status.error{color:var(--danger); background:var(--danger-soft); border-color:var(--danger-line)}
.error{
  margin:0 0 18px; padding:11px 13px; border-radius:10px; font-size:13.5px; font-weight:700;
  background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger-line);
}
.foot code{font-size:12px}
.foot{margin:22px 0 0; font-size:12px; color:var(--muted); text-align:center; line-height:1.6}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">K</div>
  <h1>코아 관리자</h1>
  <p class="sub">Discord에서 발급한 일회용 링크를 확인하고 있습니다. 서버 정보는 인증이 끝난 뒤에만 표시됩니다.</p>
  <!--ERROR-->
  <p class="status" id="status" role="status" aria-live="polite">일회용 권한을 확인하는 중…</p>
  <p class="foot">링크는 5분 안에 한 번만 사용할 수 있습니다.<br>새 링크가 필요하면 서버에서 <code>/관리자 대시보드</code>를 다시 실행하세요.</p>
</main>
<script nonce="{{NONCE}}">
const statusEl=document.getElementById('status');
const params=new URLSearchParams(location.hash.slice(1));
const token=params.get('token')||'';
history.replaceState(null,'',location.pathname);
async function exchange(){
  if(!token){
    statusEl.textContent='Discord에서 /관리자 대시보드 명령으로 새 링크를 발급해 주세요.';
    statusEl.className='status error';
    return;
  }
  try{
    const response=await fetch('/login/token',{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})
    });
    const data=await response.json();
    if(!response.ok){throw new Error(data.error||'로그인할 수 없습니다.')}
    statusEl.textContent='인증되었습니다. 대시보드로 이동합니다.';
    statusEl.className='status ok';
    location.replace('/');
  }catch(error){
    statusEl.textContent=error.message||'로그인할 수 없습니다.';
    statusEl.className='status error';
  }
}
exchange();
</script>
</body>
</html>
