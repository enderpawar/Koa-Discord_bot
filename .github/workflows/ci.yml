name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install voice runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q bot.py cogs tests
      - name: Run unit tests
        run: python -m pytest tests/unit -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t koa-bot:ci .
      - name: Verify media runtime
        run: >-
          docker run --rm --entrypoint sh koa-bot:ci -c
          'ffmpeg -version >/dev/null && deno --version &&
          python -c "import discord; import yt_dlp_plugins.extractor.getpot_bgutil;
          from yt_dlp.version import __version__; print(discord.__version__, __version__)"'
      - name: Verify YouTube PO-token provider
        run: |
          docker run --rm -d --name koa-pot-ci -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno
          for attempt in {1..12}; do
            if curl --fail --silent http://127.0.0.1:4416/ping; then
              docker exec koa-pot-ci deno eval \
                "const r=await fetch('http://127.0.0.1:4416/ping');if(!r.ok)Deno.exit(1)"
              exit 0
            fi
            sleep 5
          done
          docker logs koa-pot-ci
          exit 1
