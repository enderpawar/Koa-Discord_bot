name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install voice runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q bot.py cogs tests
      - name: Run unit tests
        run: python -m pytest tests/unit -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t koa-bot:ci .
      - name: Verify media runtime
        run: >-
          docker run --rm --entrypoint sh koa-bot:ci -c
          'ffmpeg -version >/dev/null && deno --version &&
          python -c "import discord; from yt_dlp.version import __version__; print(discord.__version__, __version__)"'
