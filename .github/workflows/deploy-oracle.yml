name: Deploy to Oracle Always Free

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: koa-bot-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate deployment secrets
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          set -Eeuo pipefail
          for key in \
            OCI_HOST OCI_USER OCI_SSH_PRIVATE_KEY OCI_SSH_KNOWN_HOSTS \
            DISCORD_TOKEN AZURE_SPEECH_KEY AZURE_SPEECH_REGION
          do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required repository secret is missing: ${key}"
              exit 1
            fi
          done

      - name: Prepare SSH and deployment artifacts
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          VALORANT_API_KEY: ${{ secrets.VALORANT_API_KEY }}
          YOUTUBE_PROXY_URL: ${{ secrets.YOUTUBE_PROXY_URL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          TEST_GUILD_ID: ${{ secrets.TEST_GUILD_ID }}
          ADMIN_WEB_ENABLED: ${{ vars.ADMIN_WEB_ENABLED }}
          ADMIN_WEB_HOST: ${{ vars.ADMIN_WEB_HOST }}
          ADMIN_WEB_PORT: ${{ vars.ADMIN_WEB_PORT }}
          ADMIN_WEB_PUBLIC_URL: ${{ vars.ADMIN_WEB_PUBLIC_URL }}
          MEM_ANCHOR_BYTES: ${{ vars.MEM_ANCHOR_BYTES }}
          MEM_ANCHOR_INTERVAL_SEC: ${{ vars.MEM_ANCHOR_INTERVAL_SEC }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "${HOME}/.ssh/oracle"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/oracle" "${HOME}/.ssh/known_hosts"

          git archive \
            --format=tar.gz \
            --output="/tmp/koa-bot-${GITHUB_SHA}.tar.gz" \
            "$GITHUB_SHA"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = (
              "DISCORD_TOKEN",
              "AZURE_SPEECH_KEY",
              "AZURE_SPEECH_REGION",
          )
          optional = (
              "LOG_LEVEL",
              "TEST_GUILD_ID",
              "ADMIN_WEB_ENABLED",
              "ADMIN_WEB_HOST",
              "ADMIN_WEB_PORT",
              "ADMIN_WEB_PUBLIC_URL",
              "MEM_ANCHOR_BYTES",
              "MEM_ANCHOR_INTERVAL_SEC",
              "RIOT_API_KEY",
              "VALORANT_API_KEY",
              "YOUTUBE_PROXY_URL",
          )

          lines = []
          for key in required + optional:
              value = os.environ.get(key, "")
              if value or key in required:
                  lines.append(f"{key}={json.dumps(value)}")

          Path(f"/tmp/koa-bot-{os.environ['GITHUB_SHA']}.env").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          chmod 600 "/tmp/koa-bot-${GITHUB_SHA}.env"

      - name: Upload release
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -Eeuo pipefail
          scp -i "${HOME}/.ssh/oracle" \
            "/tmp/koa-bot-${GITHUB_SHA}.tar.gz" \
            "/tmp/koa-bot-${GITHUB_SHA}.env" \
            "scripts/remote_deploy.sh" \
            "${OCI_USER}@${OCI_HOST}:/tmp/"

      - name: Deploy and verify
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "${HOME}/.ssh/oracle" \
            "${OCI_USER}@${OCI_HOST}" \
            "mv /tmp/remote_deploy.sh /tmp/koa-bot-${GITHUB_SHA}-deploy.sh && chmod 700 /tmp/koa-bot-${GITHUB_SHA}-deploy.sh && /tmp/koa-bot-${GITHUB_SHA}-deploy.sh ${GITHUB_SHA}"
