services:
  bot:
    build: .
    image: koa-bot:latest
    container_name: koa-bot
    restart: unless-stopped

    # DISCORD_TOKEN, AZURE_SPEECH_*, ADMIN_WEB_* 등은 .env 에서 읽는다.
    # .env 는 .gitignore 대상이며 서버에 직접 생성한다.
    env_file:
      - .env

    # 컨테이너 재생성과 무관하게 설정/랭킹을 보존한다.
    # Dockerfile 의 CONFIG_PATH=/data/config.json, RANK_PATH=/data/rank_stats.json 과 대응.
    volumes:
      - ./data:/data

    # 웹 어드민을 쓸 때만 필요. 컨테이너 안에서는 ADMIN_WEB_HOST=0.0.0.0 으로
    # 열어야 이 게시 포트가 앱에 도달한다(127.0.0.1 로 두면 컨테이너 루프백에만
    # 묶여 밖에서 못 붙는다).
    #
    # 게시 주소를 호스트 루프백으로 못박는다. "8080:8080" 은 0.0.0.0 에 열리는데,
    # 도커는 자체 iptables DOCKER 체인을 끼워 넣어 호스트 방화벽(ufw 등)을
    # 우회하는 경우가 있어 "방화벽에서 막았으니 괜찮다"에 기댈 수 없다.
    # 접속은 SSH 터널로 한다: ssh -L 8080:127.0.0.1:8080 ubuntu@<서버IP>
    # 진짜로 외부 공개가 필요하면 TLS 리버스 프록시를 앞에 두고 이 값을 바꿀 것.
    ports:
      - "127.0.0.1:8080:8080"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # OCI Always Free A1 인스턴스의 유휴(idle) 회수 방지용.
  # 메모리 사용률을 상시 20% 이상으로 유지해 회수 조건(CPU/네트워크/메모리 모두
  # 20% 미만일 때만 회수)을 피한다. docs/deploy-oracle.md §0 참고.
  # Oracle Always Free 가 아닌 환경(로컬 등)에서는 불필요 — 지우거나
  # `docker compose up -d bot` 처럼 이 서비스만 빼고 기동해도 무방.
  mem-anchor:
    image: python:3.12-alpine
    container_name: mem-anchor
    restart: unless-stopped
    environment:
      MEM_ANCHOR_BYTES: "${MEM_ANCHOR_BYTES:-2600000000}"
      MEM_ANCHOR_INTERVAL_SEC: "${MEM_ANCHOR_INTERVAL_SEC:-30}"
    volumes:
      - ./scripts/mem_anchor.py:/mem_anchor.py:ro
    command: ["python3", "/mem_anchor.py"]
    mem_reservation: 2700m
    mem_limit: 3g
