services:
  bot:
    build: .
    image: koa-bot:latest
    container_name: koa-bot
    restart: unless-stopped

    # DISCORD_TOKEN, AZURE_SPEECH_*, ADMIN_WEB_* 등은 .env 에서 읽는다.
    # .env 는 .gitignore 대상이며 서버에 직접 생성한다.
    env_file:
      - .env

    environment:
      # Oracle 같은 데이터센터 IP에서 발생하는 YouTube 봇 판정과 GVS 403을
      # 완화하는 yt-dlp PO Token provider. 외부 포트에는 게시하지 않는다.
      YOUTUBE_PO_TOKEN_PROVIDER_URL: http://bgutil-provider:4416
      # 공개 주소를 런타임에 물어볼 곳. ADMIN_WEB_PUBLIC_URL 이 있으면 그쪽이 우선.
      CLOUDFLARED_METRICS_URL: http://cloudflared:2000
      # 이 두 값은 이 compose 구성의 상수다. cloudflared 가 별도 컨테이너라
      # 봇은 0.0.0.0 에 바인딩해야 하고(127.0.0.1 이면 컨테이너 루프백에만 묶여
      # 터널이 못 붙는다), 이 파일로 띄운다는 것 자체가 웹 어드민을 쓴다는 뜻이다.
      # 배포 환경 변수에 빠뜨리면 터널이 502 만 뱉는 형태로 조용히 깨지므로
      # 기본값을 여기서 못박고, 필요하면 .env 로 덮어쓴다.
      ADMIN_WEB_ENABLED: "${ADMIN_WEB_ENABLED:-1}"
      ADMIN_WEB_HOST: "${ADMIN_WEB_HOST:-0.0.0.0}"
      # 외부 접근은 Cloudflare 가 종단한 HTTPS 로만 들어온다. SSH 터널
      # (http://127.0.0.1:8080)은 브라우저가 보안 컨텍스트로 취급하므로
      # Secure 쿠키가 그대로 저장된다.
      ADMIN_WEB_COOKIE_SECURE: "1"
      # 로그인 실패 집계를 실제 사용자 IP 로 하기 위해, cloudflared 가 붙이는
      # CF-Connecting-IP 를 믿을 직전 홉 대역. compose 브리지 네트워크의
      # 컨테이너 IP 는 유동적이라 대역으로 적는다. 이 포트는 호스트 루프백과
      # 컴포즈 네트워크에서만 닿으므로 이 신뢰 범위로 충분하다.
      ADMIN_WEB_TRUSTED_PROXIES: "172.16.0.0/12"

    depends_on:
      bgutil-provider:
        condition: service_healthy

    # 컨테이너 재생성과 무관하게 설정/랭킹을 보존한다.
    # Dockerfile 의 CONFIG_PATH=/data/config.json, RANK_PATH=/data/rank_stats.json 과 대응.
    volumes:
      - ./data:/data

    # 웹 어드민을 쓸 때만 필요. 컨테이너 안에서는 ADMIN_WEB_HOST=0.0.0.0 으로
    # 열어야 이 게시 포트가 앱에 도달한다(127.0.0.1 로 두면 컨테이너 루프백에만
    # 묶여 밖에서 못 붙는다).
    #
    # 게시 주소를 호스트 루프백으로 못박는다. "8080:8080" 은 0.0.0.0 에 열리는데,
    # 도커는 자체 iptables DOCKER 체인을 끼워 넣어 호스트 방화벽(ufw 등)을
    # 우회하는 경우가 있어 "방화벽에서 막았으니 괜찮다"에 기댈 수 없다.
    # 접속은 SSH 터널로 한다: ssh -L 8080:127.0.0.1:8080 ubuntu@<서버IP>
    # 진짜로 외부 공개가 필요하면 TLS 리버스 프록시를 앞에 두고 이 값을 바꿀 것.
    ports:
      - "127.0.0.1:8080:8080"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno
    container_name: koa-youtube-pot-provider
    restart: unless-stopped
    init: true
    mem_limit: 256m
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - const r=await fetch('http://127.0.0.1:4416/ping');if(!r.ok)Deno.exit(1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # 대시보드를 HTTPS 로 외부에 노출한다. 포트를 열지 않고 아웃바운드 연결만
  # 쓰므로 OCI 방화벽과 무관하고, TLS 는 Cloudflare 가 종단한다.
  #
  # 도메인이 없어 임시 터널(trycloudflare)을 쓴다 — 주소가 재시작마다 바뀌고
  # Cloudflare 가 가용성을 보장하지 않는다. 봇은 metrics 의 /quicktunnel 로
  # 현재 주소를 물어보므로(CLOUDFLARED_METRICS_URL) 주소가 바뀌어도 따라간다.
  # 고정 주소가 필요해지면 도메인 + named tunnel 로 바꾸고 봇에는
  # ADMIN_WEB_PUBLIC_URL 을 주면 된다 (그 값이 우선한다).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: koa-cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - --url
      - http://bot:8080
    depends_on:
      - bot
    mem_limit: 128m

  # OCI Always Free A1 인스턴스의 유휴(idle) 회수 방지용.
  # 메모리 사용률을 상시 20% 이상으로 유지해 회수 조건(CPU/네트워크/메모리 모두
  # 20% 미만일 때만 회수)을 피한다. docs/deploy-oracle.md §0 참고.
  # Oracle Always Free 가 아닌 환경(로컬 등)에서는 불필요 — 지우거나
  # `docker compose up -d bot` 처럼 이 서비스만 빼고 기동해도 무방.
  mem-anchor:
    image: python:3.12-alpine
    container_name: mem-anchor
    restart: unless-stopped
    environment:
      MEM_ANCHOR_BYTES: "${MEM_ANCHOR_BYTES:-2600000000}"
      MEM_ANCHOR_INTERVAL_SEC: "${MEM_ANCHOR_INTERVAL_SEC:-30}"
    volumes:
      - ./scripts/mem_anchor.py:/mem_anchor.py:ro
    command: ["python3", "/mem_anchor.py"]
    mem_reservation: 2700m
    mem_limit: 3g
